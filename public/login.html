<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | Event Ticketing</title><link rel="stylesheet" href="/css/styles.css"></head><body><header class="site-header"><a class="brand" href="/">Event Ticketing</a><nav data-session-nav></nav></header><main><h1>Account</h1><section class="auth-grid"><form id="login-form" class="panel"><h2>Log in</h2><label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="email" required><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required><button class="primary">Log in</button><p id="login-status" role="status"></p></form><form id="signup-form" class="panel"><h2>Create account</h2><label for="signup-name">Full name</label><input id="signup-name" name="name" autocomplete="name" required><label for="signup-email">Email</label><input id="signup-email" name="email" type="email" autocomplete="email" required><label for="signup-password">Password (at least 8 characters)</label><input id="signup-password" name="password" type="password" minlength="8" autocomplete="new-password" required><label for="signup-role">Account type</label><select id="signup-role" name="role"><option value="attendee">Attendee</option><option value="organizer">Organizer</option></select><button class="primary">Create account</button><p id="signup-status" role="status"></p></form></section></main><script type="module" src="/js/pages/login.js"></script></body></html>
