<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizer dashboard | Event Ticketing</title><link rel="stylesheet" href="/css/styles.css"></head><body><header class="site-header"><a class="brand" href="/">Event Ticketing</a><nav data-session-nav></nav></header><main><h1>Organizer dashboard</h1><p>Create an event, add at least one ticket tier, then publish it.</p><form id="event-form" class="panel"><h2>New event</h2><label for="title">Event title</label><input id="title" name="title" required><label for="city">City</label><input id="city" name="city" required><label for="venue">Venue</label><input id="venue" name="venue"><label for="startsAt">Start date and time</label><input id="startsAt" name="startsAt" type="datetime-local" required><button class="primary">Create draft event</button><p id="event-status" role="status"></p></form><section id="tier-panel" class="panel" hidden><h2>Add ticket tier</h2><form id="tier-form"><label for="tier-name">Tier name</label><input id="tier-name" name="name" required><label for="price">Price (₦)</label><input id="price" name="price" type="number" min="0" step="0.01" required><label for="capacity">Capacity</label><input id="capacity" name="capacity" type="number" min="1" step="1" required><button class="primary">Add tier</button></form><p id="tier-status" role="status"></p><button id="publish" class="primary" disabled>Publish event</button></section></main><script type="module" src="/js/pages/organizer.js"></script></body></html>
